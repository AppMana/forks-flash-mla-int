name: Build wheels (stable ABI, cp39-abi3)

# Builds three Linux wheels for flash_mla, all cp39-abi3 + torch-stable (TORCH_STABLE_ONLY),
# so a single wheel works on any torch >= 2.9 built against CUDA 13.x:
#   1. jammy        -> built on Ubuntu 22.04 (glibc 2.35).
#   2. manylinux    -> built in manylinux_2_28 (glibc 2.28). Portable: runs on jammy,
#                      noble, and anything with glibc >= 2.28.
#   3. manylinux aarch64 -> the same, for arm64 hosts (DGX Spark / GB10, whose
#                      Grace CPU cannot install an x86_64 wheel at all).
#
# FLASH_MLA_CUDA_ARCHS is the SASS matrix baked into every wheel. sm_80 is the floor
# (the Ampere kernels use cp.async / ldmatrix / mma.m16n8k16); the Hopper sources are
# always additionally compiled for sm_90a. sm_100 / sm_120 / sm_121 require CUDA >= 12.8 --
# this workflow pins CUDA 13.0, so they are in range.

on:
  push:
    branches: [build-wheels, appmana/vllm-ampere, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TORCH_VERSION: "2.11.0"
  CUDA_INDEX: "cu130"
  # 121 is the DGX Spark GB10 (consumer Blackwell). The sparse kernels are
  # Ampere-instruction (cp.async / ldmatrix / mma.m16n8k16), which sm_12x has,
  # and it is the only sparse-MLA family that runs there at all — upstream
  # covers Hopper via WGMMA and datacenter Blackwell via tcgen05, neither of
  # which consumer Blackwell implements.
  FLASH_MLA_CUDA_ARCHS: "80,86,89,90,100,120,121"

jobs:
  release-meta:
    name: Compute release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Compute tag and release name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v2.0.0"
          fi
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=flash_mla ${tag}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- jammy (glibc 2.35)
  jammy-wheel:
    name: Wheel (jammy, glibc 2.35)
    runs-on: ubuntu-22.04
    needs: release-meta
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install CUDA toolkit 13.0
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: "13.0.2"
          method: network
          log-file-suffix: jammy

      - name: Show nvcc
        run: nvcc --version

      - name: Install build deps + torch
        run: |
          set -euo pipefail
          uv pip install --system packaging setuptools wheel numpy ninja
          uv pip install --system --index-url https://download.pytorch.org/whl/${CUDA_INDEX} torch==${TORCH_VERSION}

      - name: Build wheel
        env:
          EXT_PARALLEL: "2"
          MAX_JOBS: "2"
          NVCC_THREADS: "2"
          FLASH_MLA_CUDA_ARCHS: ${{ env.FLASH_MLA_CUDA_ARCHS }}
        run: |
          set -euo pipefail
          rm -rf build dist
          python setup.py bdist_wheel --verbose
          # tag as manylinux_2_35 (glibc 2.35) so pip resolves it correctly
          python -m pip install --quiet auditwheel || true
          ls -la dist/*.whl

      - name: Verify cp39-abi3 tag
        run: |
          set -euo pipefail
          for whl in dist/*.whl; do
            case "$whl" in
              *cp39-abi3*) echo "ok: $whl" ;;
              *) echo "Unexpected wheel tag (want cp39-abi3): $whl"; exit 1 ;;
            esac
          done

      - name: Smoke import (registers torch.ops.flash_mla.*)
        run: |
          set -euo pipefail
          uv pip install --system --index-url https://download.pytorch.org/whl/${CUDA_INDEX} torch==${TORCH_VERSION}
          uv pip install --system --no-deps dist/*.whl
          cd /tmp
          python -c "import torch, flash_mla_cuda; print('flash_mla ops:', [n for n in dir(torch.ops.flash_mla)])"
          python -c "from flash_mla import flash_mla_with_kvcache, flash_mla_with_kvcache_int8; print('interface OK')"

      - uses: actions/upload-artifact@v4
        with:
          name: flash_mla-jammy-${{ env.CUDA_INDEX }}
          path: dist/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------- manylinux_2_28 (glibc 2.28)
  # Runs the pytorch cuda13 builder via `docker run` on the host (not as a job
  # `container:`) so we can free ~14GB of runner disk BEFORE the ~20GB image pull
  # -- otherwise container init dies with "no space left on device".
  manylinux-wheel:
    name: Wheel (manylinux_2_28, glibc 2.28)
    runs-on: ubuntu-24.04
    needs: release-meta
    steps:
      - name: Free runner disk (cuda13 manylinux builder is ~20GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build + repair manylinux_2_28 wheel in the pytorch cuda13 builder
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/io -w /io \
            -e FLASH_MLA_CUDA_ARCHS="${FLASH_MLA_CUDA_ARCHS}" \
            pytorch/manylinux2_28-builder:cuda13.0 bash -c '
            set -euo pipefail
            export PATH=/opt/python/cp312-cp312/bin:$PATH
            python -m pip install -q -U pip uv
            uv pip install --system -q packaging setuptools wheel numpy ninja
            uv pip install --system -q --index-url https://download.pytorch.org/whl/'"${CUDA_INDEX}"' torch=='"${TORCH_VERSION}"'
            rm -rf build dist dist_manylinux
            FLASH_MLA_DISABLE_FP16=TRUE MAX_JOBS=2 NVCC_THREADS=2 python setup.py bdist_wheel
            uv pip install --system -q auditwheel
            auditwheel repair dist/*.whl --plat manylinux_2_28_x86_64 \
              --exclude "libtorch*.so*" --exclude "libc10*.so*" --exclude "libcudart*.so*" \
              --exclude "libcudnn*.so*" --exclude "libcublas*.so*" --exclude "libnvToolsExt*.so*" \
              -w /io/dist_manylinux/
          '
          sudo chown -R "$(id -u):$(id -g)" dist_manylinux 2>/dev/null || true
          ls -la dist_manylinux/*.whl

      - name: Verify cp39-abi3 + manylinux tag
        run: |
          set -euo pipefail
          for whl in dist_manylinux/*.whl; do
            case "$whl" in
              *cp39-abi3*manylinux_2_28*) echo "ok: $whl" ;;
              *) echo "Unexpected wheel tag (want cp39-abi3 + manylinux_2_28): $whl"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: flash_mla-manylinux_2_28-${{ env.CUDA_INDEX }}
          path: dist_manylinux/*.whl
          if-no-files-found: error

  # ------------------------------------------------- manylinux_2_28 aarch64 (glibc 2.28)
  # Same build as the x86_64 manylinux job, on an arm64 runner. Needed for the
  # DGX Spark (GB10): its CPU is Grace (aarch64), so an x86_64 wheel cannot be
  # installed there at all, regardless of which SASS it carries.
  #
  # The builder image is `manylinuxaarch64-builder` -- note the naming differs
  # from the x86_64 job's `manylinux2_28-builder`, and that image is a
  # linux/amd64-only manifest, so it cannot simply be reused here.
  manylinux-wheel-aarch64:
    name: Wheel (manylinux_2_28, aarch64)
    runs-on: ubuntu-24.04-arm
    needs: release-meta
    steps:
      - name: Free runner disk (cuda13 manylinux builder is ~20GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The hosted arm64 runner is 4 cores / 16 GB and was OOM-killed ~50 min in
      # ("lost communication with the server", no logs uploaded) building the
      # full 7-gencode matrix. Narrow it: no aarch64 NVIDIA host ships an
      # sm_80/86/89/120 GPU, so this wheel only needs Grace-class parts --
      # sm_90 (GH200), sm_100 (GB200) and sm_121 (GB10/DGX Spark). Serialize
      # nvcc too; wall-clock matters less than finishing.
      - name: Build + repair manylinux_2_28 aarch64 wheel in the pytorch cuda13 builder
        env:
          FLASH_MLA_CUDA_ARCHS_AARCH64: "90,100,121"
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/io -w /io \
            -e FLASH_MLA_CUDA_ARCHS="${FLASH_MLA_CUDA_ARCHS_AARCH64}" \
            pytorch/manylinuxaarch64-builder:cuda13.0 bash -c '
            set -euo pipefail
            export PATH=/opt/python/cp312-cp312/bin:$PATH
            python -m pip install -q -U pip uv
            uv pip install --system -q packaging setuptools wheel numpy ninja
            uv pip install --system -q --index-url https://download.pytorch.org/whl/'"${CUDA_INDEX}"' torch=='"${TORCH_VERSION}"'
            rm -rf build dist dist_manylinux
            FLASH_MLA_DISABLE_FP16=TRUE MAX_JOBS=1 NVCC_THREADS=1 python setup.py bdist_wheel
            uv pip install --system -q auditwheel
            auditwheel repair dist/*.whl --plat manylinux_2_28_aarch64 \
              --exclude "libtorch*.so*" --exclude "libc10*.so*" --exclude "libcudart*.so*" \
              --exclude "libcudnn*.so*" --exclude "libcublas*.so*" --exclude "libnvToolsExt*.so*" \
              -w /io/dist_manylinux/
          '
          sudo chown -R "$(id -u):$(id -g)" dist_manylinux 2>/dev/null || true
          ls -la dist_manylinux/*.whl

      - name: Verify cp39-abi3 + manylinux aarch64 tag
        run: |
          set -euo pipefail
          for whl in dist_manylinux/*.whl; do
            case "$whl" in
              *cp39-abi3*manylinux_2_28_aarch64*) echo "ok: $whl" ;;
              *) echo "Unexpected wheel tag (want cp39-abi3 + manylinux_2_28_aarch64): $whl"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: flash_mla-manylinux_2_28_aarch64-${{ env.CUDA_INDEX }}
          path: dist_manylinux/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------- publish
  publish-release:
    name: Publish release
    runs-on: ubuntu-24.04
    needs: [release-meta, jammy-wheel, manylinux-wheel, manylinux-wheel-aarch64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: List wheels
        run: ls -la release-artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.release-meta.outputs.release_name }}
          draft: false
          prerelease: false
          files: release-artifacts/*.whl
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- gh-pages simple index
  publish-simple-index:
    name: Publish gh-pages PEP 503 simple index
    runs-on: ubuntu-24.04
    needs: [release-meta, jammy-wheel, manylinux-wheel, manylinux-wheel-aarch64, publish-release]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Prepare gh-pages branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REPO_URL" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REPO_URL" gh-pages
          else
            mkdir -p gh-pages && pushd gh-pages >/dev/null
            git init -q && git checkout -q -b gh-pages && git remote add origin "$REPO_URL"
            popd >/dev/null
          fi

      - name: Regenerate simple index (append this release's wheels)
        shell: bash
        env:
          TAG_NAME: ${{ needs.release-meta.outputs.tag_name }}
        run: |
          set -euo pipefail
          pkg_dir="gh-pages/flash-mla"          # PEP 503 normalizes flash_mla -> flash-mla
          mkdir -p "$pkg_dir"
          manifest="${pkg_dir}/links.tsv"; touch "$manifest"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}"
          urlquote () { python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$1"; }

          shopt -s nullglob
          n=0
          for whl in release-artifacts/*.whl; do
            base="$(basename "$whl")"; hash="$(sha256sum "$whl" | awk '{print $1}')"
            url="${base_url}/$(urlquote "$base")"
            tmp="$(mktemp)"; awk -F '\t' -v n="$base" '$1!=n' "$manifest" > "$tmp"
            printf '%s\t%s\t%s\n' "$base" "$hash" "$url" >> "$tmp"; mv "$tmp" "$manifest"
            n=$((n+1))
          done
          [ "$n" -gt 0 ] || { echo "no wheels to index"; exit 1; }

          # package index page
          { echo '<!doctype html><html><body>'
            sort "$manifest" | while IFS=$'\t' read -r name hash url; do
              [ -n "$name" ] && printf '<a href="%s#sha256=%s">%s</a><br/>\n' "$url" "$hash" "$name"
            done
            echo '</body></html>'; } > "${pkg_dir}/index.html"
          # root index page
          { echo '<!doctype html><html><body><a href="flash-mla/">flash-mla</a></body></html>'; } > gh-pages/index.html
          touch gh-pages/.nojekyll

      - name: Commit and push gh-pages
        shell: bash
        run: |
          set -euo pipefail
          pushd gh-pages >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && { echo "no index changes"; exit 0; }
          git commit -q -m "simple index: ${GITHUB_SHA}"
          git push -q origin gh-pages
          popd >/dev/null
